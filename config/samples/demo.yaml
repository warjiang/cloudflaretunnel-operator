apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-credentials
type: Opaque
stringData:
  api-token: "<YOUR_CLOUDFLARE_API_TOKEN>"
  account-id: "<YOUR_CLOUDFLARE_ACCOUNT_ID>"
---
apiVersion: cloudflaretunnel.spotty.com.cn/v1alpha1
kind: CloudflareTunnel
metadata:
  labels:
    app.kubernetes.io/name: cloudflaretunnel-operator
    app.kubernetes.io/managed-by: kustomize
  name: cloudflaretunnel-sample
spec:
  tunnelName: createbycr
  credentialsRef:
    name: cloudflare-credentials
  ingress:
    rules:
      - path: /api
        service:
          name: demo-backend
          namespace: demo
          port: 8080
  connector:
    image: cloudflare/cloudflared:2026.3.0
    replicas: 1
