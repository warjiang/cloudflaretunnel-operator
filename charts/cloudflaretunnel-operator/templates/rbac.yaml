{{- if .Values.leaderElection.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloudflaretunnel-operator.leaderElectionRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloudflaretunnel-operator.leaderElectionRoleBindingName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloudflaretunnel-operator.leaderElectionRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "cloudflaretunnel-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflaretunnel-operator.managerRoleName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels/finalizers"]
  verbs: ["update"]
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels/status"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloudflaretunnel-operator.managerRoleBindingName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloudflaretunnel-operator.managerRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "cloudflaretunnel-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
{{- if .Values.metrics.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflaretunnel-operator.metricsAuthRoleName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflaretunnel-operator.metricsReaderRoleName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
rules:
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cloudflaretunnel-operator.metricsAuthRoleBindingName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cloudflaretunnel-operator.metricsAuthRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "cloudflaretunnel-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflaretunnel-operator.adminRoleName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels"]
  verbs: ["*"]
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflaretunnel-operator.editorRoleName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflaretunnel-operator.viewerRoleName" . }}
  labels:
    {{- include "cloudflaretunnel-operator.labels" . | nindent 4 }}
rules:
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cloudflaretunnel.spotty.com.cn"]
  resources: ["cloudflaretunnels/status"]
  verbs: ["get"]
