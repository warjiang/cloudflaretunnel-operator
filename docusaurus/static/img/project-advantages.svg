<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cloudflare Tunnel Operator advantages">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b2239"/>
      <stop offset="100%" stop-color="#0f5b87"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eaf4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text x="70" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">
    Cloudflare Tunnel Operator
  </text>
  <text x="70" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#c9e8ff">
    Secure, Declarative, Kubernetes-Native Tunnel Management
  </text>

  <rect x="60" y="210" width="520" height="170" rx="18" fill="url(#card)"/>
  <text x="90" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b2239">Secret-First Security</text>
  <text x="90" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">Credentials come from Kubernetes Secret</text>
  <text x="90" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">No plaintext API token in CRD spec</text>

  <rect x="620" y="210" width="520" height="170" rx="18" fill="url(#card)"/>
  <text x="650" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b2239">Auto Token Sync</text>
  <text x="650" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">Tunnel token is generated and synced</text>
  <text x="650" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">to Kubernetes Secret automatically</text>

  <rect x="60" y="400" width="520" height="170" rx="18" fill="url(#card)"/>
  <text x="90" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b2239">Production Lifecycle</text>
  <text x="90" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">Finalizer-based clean deletion flow</text>
  <text x="90" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">Create, reconcile, and teardown covered</text>

  <rect x="620" y="400" width="520" height="170" rx="18" fill="url(#card)"/>
  <text x="650" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b2239">Observable State</text>
  <text x="650" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">Conditions + observedGeneration</text>
  <text x="650" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#15324a">make status and diagnostics clear</text>
</svg>
