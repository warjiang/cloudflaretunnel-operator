name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - feat/*

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Setup Helm
        uses: azure/setup-helm@v4.1.0

      - name: Lint chart
        run: helm lint charts/cloudflaretunnel-operator

      - name: Render chart
        run: helm template test charts/cloudflaretunnel-operator --namespace cloudflaretunnel-operator-system >/dev/null

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository_owner }}/cloudflaretunnel-operator
            ghcr.io/${{ github.repository_owner }}/cloudflaretunnel-operator
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: helm-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Setup Helm
        uses: azure/setup-helm@v4.1.0

      - name: Set chart version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART="charts/cloudflaretunnel-operator/Chart.yaml"
          sed -i.bak -E "s/^version: .*/version: ${TAG}/" "${CHART}"
          sed -i.bak -E "s/^appVersion: .*/appVersion: \"${TAG}\"/" "${CHART}"
          rm -f "${CHART}.bak"

      - name: Package chart
        run: |
          mkdir -p .cr-release-packages
          helm package charts/cloudflaretunnel-operator --destination .cr-release-packages

      - name: Login to GHCR (OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Push chart to GHCR OCI
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          helm push ".cr-release-packages/cloudflaretunnel-operator-${TAG}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
