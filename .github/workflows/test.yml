name: Tests

on:
  # push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Clone the code
        uses: actions/checkout@v4.2.0

      - name: Setup Go
        uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
